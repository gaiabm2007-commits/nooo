<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth Y2K</title>
<style>
  :root{
    --pink:#ff9ecb;
    --pink-deep:#d6336c;
    --blue:#8fd8ff;
    --lilac:#e6ccff;
    --gold:#ffcf7a;
    --ink:#3d2e22;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 10% 10%, rgba(255,158,203,0.35), transparent 45%),
      radial-gradient(circle at 90% 20%, rgba(143,216,255,0.35), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(230,204,255,0.35), transparent 50%),
      #fdf6fa;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  h1{
    font-size:1.9rem;
    margin:0 0 2px;
    color:var(--pink-deep);
    text-shadow:1px 1px 0 #fff;
    letter-spacing:1px;
  }
  .sub{
    color:#9a6aa8;
    margin:0 0 20px;
    font-size:0.9rem;
  }

  .camera-wrap{
    position:relative;
    width:100%;
    max-width:420px;
  }
  .camera-wrap img.chrome{
    width:100%;
    display:block;
    position:relative;
    z-index:3;
    pointer-events:none;
    user-select:none;
  }
  .screen-video{
    position:absolute;
    left:18.9%;
    top:33.7%;
    width:43.4%;
    height:44.7%;
    overflow:hidden;
    z-index:1;
    background:#000;
    border-radius:2px;
  }
  .screen-video video, .screen-video img.resultShot{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .screen-video img.resultShot{ display:none; }

  .countdownNum{
    position:absolute;
    left:18.9%;
    top:33.7%;
    width:43.4%;
    height:44.7%;
    z-index:4;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:2.6rem;
    font-weight:bold;
    color:#fff;
    text-shadow:0 0 10px rgba(0,0,0,0.7);
    background:rgba(0,0,0,0.15);
  }
  .flash{
    position:absolute;
    left:18.9%;
    top:33.7%;
    width:43.4%;
    height:44.7%;
    z-index:5;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  .flash.on{ animation:flashPop 350ms ease-out; }
  @keyframes flashPop{ 0%{opacity:0.95;} 100%{opacity:0;} }

  .shutterBtn{
    position:absolute;
    left:55%;
    top:70%;
    width:11%;
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff9a9a, #d61f1f 75%);
    border:2px solid #fff;
    box-shadow:0 0 0 2px #d61f1f, 0 2px 6px rgba(0,0,0,0.3);
    z-index:6;
    cursor:pointer;
  }
  .shutterBtn:disabled{ opacity:0.4; cursor:not-allowed; }
  .shutterBtn:active{ transform:scale(0.92); }

  .panel{
    width:100%;
    max-width:420px;
    margin-top:16px;
    background:#fff;
    border-radius:18px;
    padding:16px 16px 18px;
    box-shadow:0 6px 20px rgba(214,51,108,0.12);
  }
  .row{ margin-bottom:14px; }
  .row:last-child{ margin-bottom:0; }
  .row .label{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#a678b5;
    margin-bottom:6px;
    display:block;
  }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    background:#fff;
    border:2px solid var(--pink);
    color:var(--pink-deep);
    padding:6px 14px;
    border-radius:999px;
    font-size:0.82rem;
    cursor:pointer;
  }
  .chip.active{
    background:var(--pink);
    color:#fff;
    font-weight:bold;
  }
  .chip.blueChip{ border-color:var(--blue); color:#1c6f95; }
  .chip.blueChip.active{ background:var(--blue); color:#08425c; }
  .chip.goldChip{ border-color:var(--gold); color:#8a5c14; }
  .chip.goldChip.active{ background:var(--gold); color:#4a3106; }

  .stripPreviewRow{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:12px;
    flex-wrap:wrap;
  }
  .stripPreviewRow img{
    width:56px;
    height:74px;
    object-fit:cover;
    border-radius:6px;
    border:2px solid var(--pink);
  }

  .resultWrap{
    display:none;
    margin-top:16px;
    width:100%;
    max-width:420px;
    background:linear-gradient(160deg,#fff0f7,#eef6ff);
    border-radius:18px;
    padding:14px;
    text-align:center;
  }
  .resultWrap img.finalStrip{
    max-width:100%;
    border-radius:12px;
    border:3px solid #fff;
    box-shadow:0 4px 16px rgba(0,0,0,0.15);
  }
  .actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:12px;
  }
  .btn{
    border:2px solid var(--pink);
    background:#fff;
    color:var(--pink-deep);
    padding:8px 16px;
    border-radius:999px;
    font-size:0.85rem;
    cursor:pointer;
  }
  .btn.primary{ background:var(--pink); color:#fff; font-weight:bold; }
  .hidden{ display:none !important; }
</style>
</head>

const stripPreviewRow = document.getElementById('stripPreviewRow');
const resultWrap = document.getElementById('resultWrap');
const finalStrip = document.getElementById('finalStrip');
const retakeBtn = document.getElementById('retakeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const mirrorModeCheckbox = document.getElementById('mirrorMode');
const workCanvas = document.getElementById('workCanvas');
const ctx = workCanvas.getContext('2d');

let currentCount = 3;
let currentTimer = 3;
let currentFilter = 'none';
let mirrorOn = true;
let lastStripDataUrl = null;

const filterCSS = {
  none: 'none',
  disposable: 'contrast(1.12) saturate(1.3) brightness(1.08) sepia(0.12)',
  flash90: 'contrast(1.3) brightness(1.15) saturate(0.9)',
  cyberblue: 'saturate(1.5) hue-rotate(190deg) contrast(1.1)',
  candy: 'brightness(1.1) saturate(1.35) contrast(0.95)'
};

video.classList.toggle('mirrored', mirrorOn);
video.style.transform = mirrorOn ? 'scaleX(-1)' : 'none';

async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
  }catch(err){
    document.querySelector('.sub').textContent = 'No se pudo acceder a la cámara: ' + err.message;
  }
}
startCamera();

document.getElementById('countChips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#countChips .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentCount = parseInt(chip.dataset.count, 10);
});

document.getElementById('timerChips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#timerChips .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentTimer = parseInt(chip.dataset.timer, 10);
});

document.getElementById('filterChips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.filter;
  video.style.filter = filterCSS[currentFilter];
});

mirrorModeCheckbox.addEventListener('change', (e)=>{
  mirrorOn = e.target.checked;
  video.style.transform = mirrorOn ? 'scaleX(-1)' : 'none';
});

function runCountdown(seconds){
  return new Promise(resolve=>{
    let n = seconds;
    countdownNum.style.display = 'flex';
    countdownNum.textContent = n;
    const interval = setInterval(()=>{
      n -= 1;
      if(n <= 0){
        clearInterval(interval);
        countdownNum.style.display = 'none';
        resolve();
      }else{
        countdownNum.textContent = n;
      }
    }, 1000);
  });
}

function doFlash(){
  flash.classList.remove('on');
  void flash.offsetWidth;
  flash.classList.add('on');
}

function captureFrame(){
  const vw = video.videoWidth || 720;
  const vh = video.videoHeight || 960;
  workCanvas.width = vw;
  workCanvas.height = vh;
  ctx.save();
  ctx.filter = filterCSS[currentFilter];
  if(mirrorOn){
    ctx.translate(vw, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, vw, vh);
  ctx.restore();
  return workCanvas.toDataURL('image/png');
}

async function captureSession(){
  shutterBtn.disabled = true;
  const shots = [];
  stripPreviewRow.classList.remove('hidden');
  stripPreviewRow.innerHTML = '';

  for(let i=0;i<currentCount;i++){
    await runCountdown(currentTimer);
    doFlash();
    await new Promise(r=>setTimeout(r, 150));
    const dataUrl = captureFrame();
    shots.push(dataUrl);
    const thumb = document.createElement('img');
    thumb.src = dataUrl;
    stripPreviewRow.appendChild(thumb);
    if(i < currentCount - 1) await new Promise(r=>setTimeout(r, 600));
  }

  const imgs = await Promise.all(shots.map(src=>new Promise(res=>{
    const im = new Image();
    im.onload = ()=>res(im);
    im.src = src;
  })));

  const w = imgs[0].width;
  const h = imgs[0].height;
  const gap = Math.round(w*0.045);
  const stripCanvas = document.createElement('canvas');
  stripCanvas.width = w + gap*2;
  stripCanvas.height = (h*imgs.length) + (gap*(imgs.length+1));
  const sctx = stripCanvas.getContext('2d');
  sctx.fillStyle = '#fff0f7';
  sctx.fillRect(0,0,stripCanvas.width, stripCanvas.height);
  imgs.forEach((im, idx)=>{
    sctx.drawImage(im, gap, gap + idx*(h+gap));
  });

  lastStripDataUrl = stripCanvas.toDataURL('image/png');
  finalStrip.src = lastStripDataUrl;
  resultWrap.style.display = 'block';
  shutterBtn.disabled = false;
}

shutterBtn.addEventListener('click', ()=>{
  captureSession();
});

retakeBtn.addEventListener('click', ()=>{
  resultWrap.style.display = 'none';
  stripPreviewRow.classList.add('hidden');
  stripPreviewRow.innerHTML = '';
});

downloadBtn.addEventListener('click', ()=>{
  if(!lastStripDataUrl) return;
  const a = document.createElement('a');
  a.href = lastStripDataUrl;
  a.download = 'photobooth-y2k-' + Date.now() + '.png';
  a.click();
});
</script>
</body>
</html>
