<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth</title>
<style>
  :root{
    --ink:#221a14;
    --paper:#f4ead4;
    --red:#c1442e;
    --mustard:#e0a63a;
    --line:#3d2e22;
    --panel:#2b2119;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(224,166,58,0.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(193,68,46,0.10), transparent 45%);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  h1{
    font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
    letter-spacing:2px;
    font-size:2.6rem;
    margin:0 0 4px;
    color:var(--paper);
  }
  .sub{
    color:#c9b48f;
    margin:0 0 22px;
    font-size:0.95rem;
  }
  .booth{
    background:var(--panel);
    border-radius:18px;
    padding:18px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.04);
    width:100%;
    max-width:480px;
  }
  .viewfinder{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    border:6px solid var(--line);
  }
  video, canvas.captureCanvas{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  #resultImg{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }
  .countdownNum{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    font-family:'Bebas Neue', sans-serif;
    font-size:7rem;
    color:#fff;
    text-shadow:0 0 30px rgba(0,0,0,0.8);
    background:rgba(0,0,0,0.15);
  }
  .flash{
    position:absolute;
    inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  .flash.on{
    animation:flashPop 350ms ease-out;
  }
  @keyframes flashPop{
    0%{opacity:0.9;}
    100%{opacity:0;}
  }
  .frame-none{}
  .frame-film::before, .frame-film::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:22px;
    background:repeating-linear-gradient(90deg, #0a0a0a 0 10px, #1c1c1c 10px 20px);
  }
  .frame-film::before{ top:0; }
  .frame-film::after{ bottom:0; }
  .frame-polaroid{
    border:14px solid var(--paper) !important;
    border-bottom-width:54px !important;
  }
  .frame-dash{
    outline: 5px dashed var(--mustard);
    outline-offset:-14px;
  }

  .controls{
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .row{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .row label{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#c9b48f;
  }
  .chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    background:var(--ink);
    border:1px solid var(--line);
    color:var(--paper);
    padding:7px 14px;
    border-radius:999px;
    font-size:0.85rem;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip:hover{ border-color:var(--mustard); }
  .chip.active{
    background:var(--mustard);
    color:var(--ink);
    border-color:var(--mustard);
    font-weight:600;
  }
  .shutter-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:6px;
  }
  .shutter{
    width:78px;
    height:78px;
    border-radius:50%;
    background:var(--red);
    border:5px solid #f4ead4;
    cursor:pointer;
    box-shadow:0 6px 0 #8c2f1e;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .shutter:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #8c2f1e;
  }
  .shutter:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .secondary{
    display:flex;
    gap:10px;
    justify-content:center;
  }
  .btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--paper);
    padding:9px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:0.85rem;
  }
  .btn:hover{ border-color:var(--mustard); }
  .btn.primary{
    background:var(--mustard);
    color:var(--ink);
    border-color:var(--mustard);
    font-weight:600;
  }
  .toggle{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.85rem;
    color:#c9b48f;
  }
  .hidden{ display:none !important; }
  .stripPreview{
    display:flex;
    gap:6px;
    margin-top:10px;
    justify-content:center;
  }
  .stripPreview img{
    width:60px;
    height:80px;
    object-fit:cover;
    border-radius:4px;
    border:2px solid var(--line);
  }
</style>
</head>
<body>

<h1>PHOTOBOOTH</h1>
<p class="sub">Elige filtro, marco y contador — luego sonríe.</p>

<div class="booth">
  <div class="viewfinder frame-none" id="viewfinder">
    <video id="video" autoplay playsinline muted></video>
    <img id="resultImg" alt="Foto capturada">
    <div class="countdownNum" id="countdownNum">3</div>
    <div class="flash" id="flash"></div>
  </div>

  <div class="controls">

    <div class="row">
      <label>Filtro</label>
      <div class="chips" id="filterChips">
        <div class="chip active" data-filter="none">Normal</div>
        <div class="chip" data-filter="bw">Blanco y negro</div>
        <div class="chip" data-filter="sepia">Sepia</div>
        <div class="chip" data-filter="vintage">Vintage</div>
        <div class="chip" data-filter="vivid">Vívido</div>
        <div class="chip" data-filter="cold">Frío</div>
      </div>
    </div>

    <div class="row">
      <label>Marco</label>
      <div class="chips" id="frameChips">
        <div class="chip active" data-frame="none">Sin marco</div>
        <div class="chip" data-frame="film">Rollo de cine</div>
        <div class="chip" data-frame="polaroid">Polaroid</div>
        <div class="chip" data-frame="dash">Punteado</div>
      </div>
    </div>

    <div class="row">
      <label>Contador</label>
      <div class="chips" id="timerChips">
        <div class="chip" data-timer="3">3s</div>
        <div class="chip active" data-timer="5">5s</div>
        <div class="chip" data-timer="10">10s</div>
      </div>
    </div>

    <div class="row">
      <label class="toggle">
        <input type="checkbox" id="stripMode">
        Modo tira (3 fotos seguidas)
      </label>
    </div>

    <div class="shutter-row">
      <button class="shutter" id="shutterBtn" title="Capturar"></button>
    </div>

    <div class="secondary hidden" id="resultButtons">
      <button class="btn" id="retakeBtn">Repetir</button>
      <button class="btn primary" id="downloadBtn">Descargar</button>
    </div>

    <div class="stripPreview hidden" id="stripPreview"></div>
  </div>
</div>

<canvas id="workCanvas" class="hidden"></canvas>

<script>
const video = document.getElementById('video');
const viewfinder = document.getElementById('viewfinder');
const resultImg = document.getElementById('resultImg');
const countdownNum = document.getElementById('countdownNum');
const flash = document.getElementById('flash');
const shutterBtn = document.getElementById('shutterBtn');
const resultButtons = document.getElementById('resultButtons');
const retakeBtn = document.getElementById('retakeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const stripModeCheckbox = document.getElementById('stripMode');
const stripPreview = document.getElementById('stripPreview');
const workCanvas = document.getElementById('workCanvas');
const ctx = workCanvas.getContext('2d');

let currentFilter = 'none';
let currentFrame = 'none';
let currentTimer = 5;
let lastImageDataUrl = null;

const filterCSS = {
  none: 'none',
  bw: 'grayscale(1) contrast(1.05)',
  sepia: 'sepia(0.85) saturate(1.2)',
  vintage: 'contrast(1.1) saturate(0.7) sepia(0.25) brightness(1.05)',
  vivid: 'saturate(1.6) contrast(1.15)',
  cold: 'saturate(1.1) hue-rotate(15deg) brightness(1.05) contrast(1.05)'
};

// --- Camera setup ---
async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream;
  }catch(err){
    document.querySelector('.sub').textContent = 'No se pudo acceder a la cámara: ' + err.message;
  }
}
startCamera();

// --- Chip selectors ---
document.getElementById('filterChips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#filterChips .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.filter;
  video.style.filter = filterCSS[currentFilter];
});

document.getElementById('frameChips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#frameChips .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentFrame = chip.dataset.frame;
  viewfinder.className = 'viewfinder frame-' + currentFrame;
});

document.getElementById('timerChips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#timerChips .chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentTimer = parseInt(chip.dataset.timer, 10);
});

// --- Countdown ---
function runCountdown(seconds){
  return new Promise(resolve=>{
    let n = seconds;
    countdownNum.style.display = 'flex';
    countdownNum.textContent = n;
    const interval = setInterval(()=>{
      n -= 1;
      if(n <= 0){
        clearInterval(interval);
        countdownNum.style.display = 'none';
        resolve();
      }else{
        countdownNum.textContent = n;
      }
    }, 1000);
  });
}

function doFlash(){
  flash.classList.remove('on');
  void flash.offsetWidth; // restart animation
  flash.classList.add('on');
}

// --- Capture a single frame to a data URL, applying filter + frame ---
function captureFrame(){
  const vw = video.videoWidth || 720;
  const vh = video.videoHeight || 960;
  workCanvas.width = vw;
  workCanvas.height = vh;
  ctx.save();
  ctx.filter = filterCSS[currentFilter];
  // mirror to match the mirrored preview (video is not CSS-mirrored here, so draw normally)
  ctx.drawImage(video, 0, 0, vw, vh);
  ctx.restore();

  // draw frame decoration directly on the canvas
  if(currentFrame === 'film'){
    const bar = Math.round(vh * 0.045);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0,0,vw,bar);
    ctx.fillRect(0,vh-bar,vw,bar);
  } else if(currentFrame === 'polaroid'){
    const border = Math.round(vw * 0.06);
    const bottom = Math.round(vh * 0.18);
    const framed = document.createElement('canvas');
    framed.width = vw + border*2;
    framed.height = vh + border + bottom;
    const fctx = framed.getContext('2d');
    fctx.fillStyle = '#f4ead4';
    fctx.fillRect(0,0,framed.width,framed.height);
    fctx.drawImage(workCanvas, border, border);
    workCanvas.width = framed.width;
    workCanvas.height = framed.height;
    ctx.drawImage(framed,0,0);
  } else if(currentFrame === 'dash'){
    ctx.strokeStyle = '#e0a63a';
    ctx.lineWidth = Math.round(vw*0.02);
    ctx.setLineDash([Math.round(vw*0.03), Math.round(vw*0.02)]);
    ctx.strokeRect(ctx.lineWidth, ctx.lineWidth, vw-ctx.lineWidth*2, vh-ctx.lineWidth*2);
  }

  return workCanvas.toDataURL('image/png');
}

function showResult(dataUrl){
  resultImg.src = dataUrl;
  resultImg.style.display = 'block';
  video.style.display = 'none';
  resultButtons.classList.remove('hidden');
  shutterBtn.disabled = true;
  lastImageDataUrl = dataUrl;
}

function resetToCamera(){
  resultImg.style.display = 'none';
  video.style.display = 'block';
  resultButtons.classList.remove('hidden');
  resultButtons.classList.add('hidden');
  shutterBtn.disabled = false;
  stripPreview.classList.add('hidden');
  stripPreview.innerHTML = '';
}

// --- Strip mode: 3 shots composed vertically ---
async function captureStrip(){
  const shots = [];
  stripPreview.classList.remove('hidden');
  stripPreview.innerHTML = '';
  for(let i=0;i<3;i++){
    await runCountdown(currentTimer);
    doFlash();
    await new Promise(r=>setTimeout(r, 150));
    const dataUrl = captureFrame();
    shots.push(dataUrl);
    const thumb = document.createElement('img');
    thumb.src = dataUrl;
    stripPreview.appendChild(thumb);
    if(i < 2) await new Promise(r=>setTimeout(r, 700));
  }
  // compose strip
  const imgs = await Promise.all(shots.map(src=>new Promise(res=>{
    const im = new Image();
    im.onload = ()=>res(im);
    im.src = src;
  })));
  const w = imgs[0].width;
  const h = imgs[0].height;
  const gap = Math.round(w*0.04);
  const stripCanvas = document.createElement('canvas');
  stripCanvas.width = w + gap*2;
  stripCanvas.height = (h*3) + (gap*4);
  const sctx = stripCanvas.getContext('2d');
  sctx.fillStyle = '#221a14';
  sctx.fillRect(0,0,stripCanvas.width, stripCanvas.height);
  imgs.forEach((im, idx)=>{
    sctx.drawImage(im, gap, gap + idx*(h+gap));
  });
  showResult(stripCanvas.toDataURL('image/png'));
}

// --- Shutter click ---
shutterBtn.addEventListener('click', async ()=>{
  shutterBtn.disabled = true;
  if(stripModeCheckbox.checked){
    await captureStrip();
  }else{
    await runCountdown(currentTimer);
    doFlash();
    await new Promise(r=>setTimeout(r, 150));
    const dataUrl = captureFrame();
    showResult(dataUrl);
  }
});

retakeBtn.addEventListener('click', ()=>{
  resetToCamera();
});

downloadBtn.addEventListener('click', ()=>{
  if(!lastImageDataUrl) return;
  const a = document.createElement('a');
  a.href = lastImageDataUrl;
  a.download = 'photobooth-' + Date.now() + '.png';
  a.click();
});
</script>
</body>
</html>
